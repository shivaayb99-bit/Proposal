<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Marry Me? 💍</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
–gold: #c8a45a;
–gold-light: #e8c87a;
–rose: #d4607a;
–cream: #fdf6ee;
–deep: #1a0a12;
–blush: #f5dde6;
}

body {
background: var(–deep);
color: var(–cream);
font-family: ‘Cormorant Garamond’, serif;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
overflow: hidden;
position: relative;
}

/* Starfield */
.stars {
position: fixed;
inset: 0;
pointer-events: none;
z-index: 0;
}
.star {
position: absolute;
background: white;
border-radius: 50%;
animation: twinkle var(–d, 3s) ease-in-out infinite;
opacity: 0;
}
@keyframes twinkle {
0%, 100% { opacity: 0; transform: scale(0.5); }
50% { opacity: var(–o, 0.8); transform: scale(1); }
}

/* Floating petals */
.petals {
position: fixed;
inset: 0;
pointer-events: none;
z-index: 1;
}
.petal {
position: absolute;
width: 10px;
height: 10px;
background: radial-gradient(circle at 40% 35%, #f9aec0, #d4607a);
border-radius: 50% 0 50% 0;
top: -20px;
animation: fall var(–fd, 8s) linear infinite var(–delay, 0s);
opacity: 0.7;
}
@keyframes fall {
0% { transform: translateX(0) rotate(0deg) translateY(-20px); opacity: 0; }
10% { opacity: 0.7; }
90% { opacity: 0.5; }
100% { transform: translateX(var(–drift, 80px)) rotate(720deg) translateY(110vh); opacity: 0; }
}

/* Main card */
.card {
position: relative;
z-index: 10;
text-align: center;
padding: 3.5rem 4rem;
max-width: 560px;
width: 90%;
background: linear-gradient(145deg, rgba(255,255,255,0.04), rgba(200,164,90,0.06));
border: 1px solid rgba(200,164,90,0.25);
border-radius: 2px;
box-shadow:
0 0 80px rgba(212, 96, 122, 0.12),
0 0 200px rgba(200,164,90,0.06),
inset 0 0 60px rgba(200,164,90,0.04);
animation: cardIn 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
opacity: 0;
}

@keyframes cardIn {
from { opacity: 0; transform: translateY(40px) scale(0.96); }
to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* Corner ornaments */
.card::before, .card::after {
content: ‘’;
position: absolute;
width: 40px;
height: 40px;
border-color: var(–gold);
border-style: solid;
opacity: 0.5;
}
.card::before { top: 12px; left: 12px; border-width: 1px 0 0 1px; }
.card::after  { bottom: 12px; right: 12px; border-width: 0 1px 1px 0; }

.ring-icon {
font-size: 3rem;
display: block;
margin-bottom: 1.2rem;
animation: floatRing 3s ease-in-out infinite;
filter: drop-shadow(0 0 12px rgba(200,164,90,0.6));
}
@keyframes floatRing {
0%, 100% { transform: translateY(0) rotate(-5deg); }
50% { transform: translateY(-10px) rotate(5deg); }
}

.prelude {
font-family: ‘Cormorant Garamond’, serif;
font-style: italic;
font-size: 1rem;
letter-spacing: 0.18em;
color: var(–gold);
text-transform: uppercase;
margin-bottom: 1.2rem;
opacity: 0;
animation: fadeUp 0.8s 0.6s forwards;
}

h1 {
font-family: ‘Cinzel’, serif;
font-size: clamp(2rem, 6vw, 2.8rem);
font-weight: 400;
letter-spacing: 0.06em;
line-height: 1.25;
color: var(–cream);
margin-bottom: 1.6rem;
opacity: 0;
animation: fadeUp 0.8s 0.9s forwards;
}
h1 span {
color: var(–gold-light);
font-style: italic;
}

.divider {
display: flex;
align-items: center;
gap: 1rem;
margin: 1.6rem auto;
max-width: 300px;
opacity: 0;
animation: fadeUp 0.8s 1.1s forwards;
}
.divider-line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(–gold), transparent); }
.divider-diamond {
width: 8px; height: 8px;
background: var(–gold);
transform: rotate(45deg);
flex-shrink: 0;
}

.message {
font-size: 1.15rem;
font-weight: 300;
line-height: 1.9;
color: rgba(253,246,238,0.85);
margin-bottom: 2.4rem;
opacity: 0;
animation: fadeUp 0.8s 1.3s forwards;
}

.buttons {
display: flex;
gap: 1.2rem;
justify-content: center;
flex-wrap: wrap;
opacity: 0;
animation: fadeUp 0.8s 1.6s forwards;
}

.btn {
font-family: ‘Cinzel’, serif;
font-size: 0.85rem;
letter-spacing: 0.2em;
text-transform: uppercase;
padding: 0.9rem 2.2rem;
border: none;
border-radius: 1px;
cursor: pointer;
transition: all 0.3s ease;
position: relative;
overflow: hidden;
}

.btn-yes {
background: linear-gradient(135deg, var(–gold), #a8813a);
color: var(–deep);
box-shadow: 0 4px 24px rgba(200,164,90,0.3);
}
.btn-yes::before {
content: ‘’;
position: absolute;
inset: 0;
background: linear-gradient(135deg, var(–gold-light), var(–gold));
opacity: 0;
transition: opacity 0.3s;
}
.btn-yes:hover::before { opacity: 1; }
.btn-yes:hover { transform: translateY(-3px); box-shadow: 0 8px 32px rgba(200,164,90,0.45); }

.btn-no {
background: transparent;
color: rgba(253,246,238,0.5);
border: 1px solid rgba(253,246,238,0.15);
font-size: 0.75rem;
}
.btn-no:hover { color: rgba(253,246,238,0.75); border-color: rgba(253,246,238,0.35); transform: translateY(-2px); }

/* Yes response overlay */
.yes-overlay {
position: fixed;
inset: 0;
z-index: 100;
display: flex;
align-items: center;
justify-content: center;
flex-direction: column;
gap: 1.5rem;
background: radial-gradient(ellipse at center, rgba(212,96,122,0.15) 0%, var(–deep) 70%);
opacity: 0;
pointer-events: none;
transition: opacity 0.6s ease;
text-align: center;
padding: 2rem;
}
.yes-overlay.active { opacity: 1; pointer-events: all; }
.yes-emoji { font-size: 5rem; animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards; }
.yes-title {
font-family: ‘Cinzel’, serif;
font-size: clamp(2rem, 7vw, 3.5rem);
color: var(–gold-light);
animation: popIn 0.6s 0.1s cubic-bezier(0.34,1.56,0.64,1) both;
}
.yes-sub {
font-size: 1.2rem;
font-style: italic;
color: rgba(253,246,238,0.75);
animation: popIn 0.6s 0.2s cubic-bezier(0.34,1.56,0.64,1) both;
}
@keyframes popIn {
from { transform: scale(0.5); opacity: 0; }
to   { transform: scale(1);   opacity: 1; }
}

/* Confetti hearts */
.confetti-heart {
position: fixed;
pointer-events: none;
z-index: 99;
font-size: 1.5rem;
animation: confettiFall 2s ease-in forwards;
}
@keyframes confettiFall {
0%   { transform: translateY(-10px) rotate(0deg); opacity: 1; }
100% { transform: translateY(100vh) rotate(var(–r, 360deg)); opacity: 0; }
}

@keyframes fadeUp {
from { opacity: 0; transform: translateY(16px); }
to   { opacity: 1; transform: translateY(0); }
}
</style>

</head>
<body>

<!-- Starfield -->

<div class="stars" id="stars"></div>

<!-- Petals -->

<div class="petals" id="petals"></div>

<!-- Main card -->

<div class="card">
  <span class="ring-icon">💍</span>
  <p class="prelude">A question from the heart</p>
  <h1>Will You <span>Marry</span> Me?</h1>

  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-diamond"></div>
    <div class="divider-line"></div>
  </div>

  <p class="message">
    Every moment with you feels like the first breath of spring.<br>
    You are my home, my laughter, my forever.<br><br>
    With all that I am and all that I have,<br>
    I am asking you — will you spend forever with me?
  </p>

  <div class="buttons">
    <button class="btn btn-yes" onclick="sayYes()">✦ Yes, forever ✦</button>
    <button class="btn btn-no" onclick="sayNo(this)">Maybe later…</button>
  </div>
</div>

<!-- Yes overlay -->

<div class="yes-overlay" id="yesOverlay">
  <div class="yes-emoji">🥂</div>
  <div class="yes-title">She said YES!</div>
  <div class="yes-sub">Our forever begins today. ❤️</div>
</div>

<script>
  // Stars
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      top:${Math.random()*100}%;
      --d:${(Math.random()*4+2).toFixed(1)}s;
      --o:${(Math.random()*0.7+0.3).toFixed(2)};
      animation-delay:${(Math.random()*5).toFixed(1)}s;
    `;
    starsEl.appendChild(s);
  }

  // Petals
  const petalsEl = document.getElementById('petals');
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    const size = Math.random() * 8 + 6;
    p.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      --fd:${(Math.random()*6+6).toFixed(1)}s;
      --delay:-${(Math.random()*8).toFixed(1)}s;
      --drift:${(Math.random()*160-80).toFixed(0)}px;
    `;
    petalsEl.appendChild(p);
  }

  async function sendEmailNotification(answer) {
    try {
      const formData = new FormData();
      formData.append('_replyto', 'Shivaayb99@gmail.com');
      formData.append('_subject', answer === 'YES' ? '💍 She said YES!' : '💔 She said Maybe Later...');
      formData.append('Answer', answer);
      formData.append('Message', answer === 'YES'
        ? '💍 She said YES! Congratulations! 🎉'
        : '💔 She clicked Maybe Later...');
      formData.append('Time', new Date().toLocaleString());

      const res = await fetch('https://formspree.io/f/mjglvrvg', {
        method: 'POST',
        body: formData,
        headers: { 'Accept': 'application/json' }
      });
      const data = await res.json();
      console.log('Formspree response:', data);
    } catch(e) {
      console.log('Email notification failed', e);
    }
  }

  function sayYes() {
    const overlay = document.getElementById('yesOverlay');
    overlay.classList.add('active');
    launchHearts();
    launchHearts(300);
    launchHearts(700);
    sendEmailNotification('YES');
  }

  function launchHearts(delay = 0) {
    setTimeout(() => {
      const emojis = ['❤️','💕','💖','💗','🌹','✨','💍','🥂'];
      for (let i = 0; i < 20; i++) {
        const h = document.createElement('div');
        h.className = 'confetti-heart';
        h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        h.style.cssText = `
          left:${Math.random()*100}%;
          top:${Math.random()*-10}%;
          animation-delay:${(Math.random()*0.8).toFixed(2)}s;
          animation-duration:${(Math.random()*1.5+1.5).toFixed(1)}s;
          --r:${Math.random()>0.5?'':'-'}${Math.floor(Math.random()*540)}deg;
        `;
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 4000);
      }
    }, delay);
  }

  function sayNo(btn) {
    sendEmailNotification('NO (Maybe Later)');
    btn.textContent = 'Are you sure? 🥺';
    btn.onclick = () => {
      btn.textContent = 'Please? 💍';
      btn.onclick = () => {
        btn.textContent = 'Pretty please? 🌹';
        btn.onclick = () => sayYes();
      };
    };
  }
</script>

</body>
</html>
